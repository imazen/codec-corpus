[workspace]

[package]
name = "codec-corpus"
version = "1.1.0"
edition = "2024"
description = "Runtime API for downloading, caching, and accessing test image datasets from imazen/codec-corpus and third-party sources"
license = "Apache-2.0"
repository = "https://github.com/imazen/codec-corpus"
readme = "README.md"
keywords = ["codec", "test-data", "corpus", "images"]
categories = ["development-tools::testing", "multimedia::images"]
rust-version = "1.85"

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `image` is only needed by the corruption-corpus driver (loading reference
# images + encoding JPEG anchors). The corruption generators themselves are
# pure RGB-buffer math with no decode dependency, so they stay in the default
# build and remain wasm-clean.
image = { version = "0.25.10", optional = true, default-features = false, features = [
    "png",
    "jpeg",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fd-lock = "4"

[features]
default = []
# Enables the corruption-corpus driver (`corruptions::driver`) which loads
# reference PNGs and emits JPEG q20/q10 honest-lq anchors via the `image`
# crate. Without it, only the seeded in-memory generators + manifest types
# are available.
driver = ["dep:image"]

[[example]]
name = "corruption_corpus"
required-features = ["driver"]
