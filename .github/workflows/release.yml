name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build assets for (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create release with dataset tarballs
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Create per-dataset tarballs
        run: |
          for dataset in */; do
            dataset="${dataset%/}"
            [[ "$dataset" == .* || "$dataset" == crate ]] && continue
            echo "Packing $dataset..."
            tar czf "${dataset}.tar.gz" "${dataset}/"
          done
          ls -lh *.tar.gz

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.ref }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading assets with --clobber"
            gh release upload "$TAG" *.tar.gz --clobber
          else
            echo "Creating new release $TAG"
            gh release create "$TAG" *.tar.gz \
              --title "$TAG" \
              --generate-notes
          fi
