name: CI

on:
  push:
    branches: [main]
    paths:
      - "crate/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crate/**"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Clippy (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-latest
          - name: windows-x64
            runner: windows-latest
          - name: windows-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate
      - run: cargo check
        working-directory: crate
      - run: cargo clippy -- -D warnings
        working-directory: crate

  test-unit:
    name: Unit tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-latest
          - name: windows-x64
            runner: windows-latest
          - name: windows-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate
      - run: cargo test
        working-directory: crate

  test-integration:
    name: Integration tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-latest
          - name: windows-x64
            runner: windows-latest
          - name: windows-arm64
            runner: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/codec-corpus
            ~/Library/Caches/codec-corpus
            ~\AppData\Local\codec-corpus
          key: corpus-v1-${{ matrix.name }}
          restore-keys: corpus-v1-
      - run: cargo test --release -- --ignored
        working-directory: crate
